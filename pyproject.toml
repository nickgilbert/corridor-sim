[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corridor-sim"
version = "1.0.0"
description = "Monte Carlo simulation engine for denomination-matched reserved-ramp corridor economics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SDF Strategy" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
corridor-sim = "corridor_sim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corridor_sim = ["../../templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["corridor_sim"]
